<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <title>Blackjack</title>
        <link rel="stylesheet" href="../css/style.css">
    </head>
    <body>
        <div class="wrap">
          <p class="back-row">
            <a href="../index.html" class="back-link">&larr; Volver al menú</a>
        </p>
          </p>

    <h1>BlackJack - vos vs dealer </h1>

    <div class="scores">
        <div class="score-card active">
            <p class="label">Fichas.</p>
            <p class="value" id="chipsValue">100</p>
        </div>
        <div class="score-card">
            <p class="label">Apuesta actual.</p>
            <p class="value" id="betValue">0</p>
        </div>
    </div>

    <div class="panel">
        <div class="hand-block">
            <p class="hand-label">Dealer</p>
            <p class="hand-total" id="dealerTotal">-</p>
            <div class="hand" id="dealerHand"></div>
        </div>

        <div class="hand-block">
                <p class="hand-label">Vos</p>
                <p class="hand-total" id="playerTotal">-</p>
                <div class="hand" id="playerHand"></div>
                 <p class="ace-hint is-hidden" id="aceHint">Tocá un As para elegir si vale 1 u 11.</p>
        </div>

        <div class="msg" id="msg"> Ingresa tu apuesta para comenzar la mano.</div>
           
        <div class="bet-row" id="betRow">
                <label for="betInput" class="visually-hidden">Monto de la apuesta.</label>
                <input type="number" id="betInput" min="1" value="10">
                <button type="button" class="primary btn-grow" id="btnApostar">Apostar</button>
         </div>
            
        <div class="actions is-hidden" id="playActions">
                <button type="button" class="primary" id="btnHit">Pedir carta.</button>
                <button type="button" id="btnStand">Plantarse</button>
        </div>

        </div>
        <div class="panel">
            <p class="panel-title">Historial de manos.</p>
            <div id="history" class="history"></div>
        </div>
    </div>

    <div class="guia-cartas"><a href="../html/instcartas.html">Guía de juego</a></div>

</div>
    <script src="../js/script.js"></script>
    </body>
</html>
