<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Puntajes - Zona juegos</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Rubik:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="pagina-puntajes">
<div class="wrap">

    <div class="zona-bar">zona juegos</div>

    <nav class="nav">
        <a class="nav-item" href="../index.html">Inicio</a>
        <a class="nav-item" href="dados.html">10000</a>
        <a class="nav-item" href="cartas.html">Blackjack</a>
        <a class="nav-item" href="api.html">Trivia</a>
        <a class="nav-item active" href="puntajes.html">Puntajes</a>
        <a class="nav-item" href="desarrollo.html">Integrantes</a>
    </nav>

    <main class="puntajes-main">
        <h1>Tabla de récords</h1>
        <p class="puntajes-intro">Los 5 mejores puntajes de cada juego. Se guardan en este navegador.</p>

        <div class="records-grid">

            <section class="panel records-card dados">
                <h2>10000 (dados)</h2>
                <p class="label">Mejor puntaje</p>
                <p class="records-best" id="best-dados">-</p>
                <div id="records-dados"></div>
            </section>

            <section class="panel records-card cartas">
                <h2>Blackjack</h2>
                <p class="label">Máximo de fichas</p>
                <p class="records-best" id="best-cartas">-</p>
                <div id="records-cartas"></div>
            </section>

            <section class="panel records-card trivia">
                <h2>Trivia</h2>
                <p class="label">Más aciertos</p>
                <p class="records-best" id="best-trivia">-</p>
                <div id="records-trivia"></div>
            </section>

        </div>

        <div class="records-acciones">
            <button type="button" id="btnBorrar">Borrar todos los récords</button>
        </div>
    </main>

    <footer class="site-footer">TP1 - IG 2026</footer>

</div>
<script src="../js/records.js"></script>
<script src="../js/puntajes.js"></script>
</body>
