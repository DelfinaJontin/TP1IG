<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trivia</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Rubik:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="pagina-trivia">
<div class="wrap">

    <div class="zona-bar">zona juegos</div>

    <nav class="nav">
        <a class="nav-item" href="../index.html">Inicio</a>
        <a class="nav-item" href="dados.html">10000</a>
        <a class="nav-item" href="cartas.html">Blackjack</a>
        <a class="nav-item active" href="api.html">Trivia</a>
        <a class="nav-item" href="puntajes.html">Puntajes</a>
    </nav>

    <h1>Trivia - vos vs. la computadora</h1>

    <div class="columns">

        <div class="col">
            <div class="panel mini-scores">
                <div class="mini-score">
                    <p class="label">Vos</p>
                    <p class="value" id="playerScore">0</p>
                </div>
                <div class="mini-score">
                    <p class="label">Computadora</p>
                    <p class="value" id="computerScore">0</p>
                </div>
            </div>

            <div class="panel">
                <p class="panel-title">Historial de preguntas</p>
                <div id="history" class="history-list"></div>
            </div>
        </div>

        <div class="col">
            <div class="panel">
                <p class="question-meta" id="questionMeta">Cargando preguntas...</p>
                <p class="question-text" id="questionText"></p>
                <div class="actions" id="answers"></div>
                <div class="feedback" id="feedback"></div>
            </div>
        </div>

    </div>

    <div class="banner-goal">Tenés 10 segundos por pregunta. ¡Ganale a la computadora!</div>

    <div class="guia-cartas"><a href="puntajes.html">Ver puntajes</a></div>

    <footer class="site-footer">TP1 - IG 2026</footer>

</div>
<script src="../js/records.js"></script>
<script src="../js/trivia.js"></script>
</body>
</html>
