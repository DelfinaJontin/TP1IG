<!DOCTYPE html>
<html lang="es">
  <head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trivia - vos vs. la computadora</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="wrap">

  <div class="zona-bar">zona juegos</div>

  <nav class="nav">
     <a class="nav-item" href="../index.html">Inicio</a>
     <a class="nav-item" href="dados.html">10000</a>
     <a class="nav-item" href="cartas.html">Blackjack</a>
     <a class="nav-item active" href="api.html">Trivia</a>
  </nav>

  <h1>Trivia - vos vs. la computadora</h1>

  <div class="columns">

    <div class="col">
      <div class="panel mini-scores">
        <div class="mini-score">
          <p class="label">Vos</p>
          <p class="value" id="playerScore">0</p>
        </div>
        <div class="mini-score">
          <p class="label">Computadora</p>
          <p class="value" id="computerScore">0</p>
        </div>
      </div>

      <div class="panel">
        <p>Historial de preguntas</p>
        <div id="history" class="history-list"></div>
      </div>
    </div>

    <div class="col">
      <div class="panel">
        <p class="question-meta" id="questionMeta">Cargando preguntas...</p>
        <p class="question-text" id="questionText"></p>
        <div class="actions">
          <button class="primary answer-btn" id="btnTrue" disabled="">Verdadero</button>
          <button class="answer-btn" id="btnFalse" disabled="">Falso</button>
        </div>
        <div class="feedback" id="feedback"></div>
      </div>
    </div>

  <footer class="site-footer">tp1 2026</footer>

</div>
<script src="../js/trivia.js"></script>
</body>
</html>
