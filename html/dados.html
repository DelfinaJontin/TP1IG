<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>10000 - Juego de dados</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="wrap">
  <h1>10000 - vos vs. la computadora</h1>

  <div class="scores">
    <div class="score-card" id="cardPlayer">
      <p class="label">Vos</p>
      <p class="value" id="playerScore">0</p>
    </div>
    <div class="score-card" id="cardComputer">
      <p class="label">Computadora</p>
      <p class="value" id="computerScore">0</p>
    </div>
  </div>
<div class="panel">
    <div class="turn-info">
      <span>Turno: <b id="turnLabel">Vos</b></span>
      <span>Acumulado del turno: <b id="turnScoreLabel">0</b></span>
    </div>
    <div class="dice-row" id="diceRow"></div>
    <div class="msg" id="msg">Presioná "Tirar dados" para empezar.</div>
    <div class="actions">
      <button class="primary" id="btnRoll">Tirar dados</button>
      <button id="btnBank" disabled="">Plantarse</button>
    </div>
  </div>
